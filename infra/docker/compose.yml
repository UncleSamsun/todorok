name: todorok

x-planner-image: &planner-image
  image: todorok/planner-service:local
  build:
    context: ../..
    dockerfile: services/planner-service/Dockerfile

x-activity-image: &activity-image
  image: todorok/activity-service:local
  build:
    context: ../..
    dockerfile: services/activity-service/Dockerfile

x-notification-image: &notification-image
  image: todorok/notification-service:local
  build:
    context: ../..
    dockerfile: services/notification-service/Dockerfile

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  planner-migration:
    <<: *planner-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=planner
      SPRING_DATASOURCE_USERNAME: planner_app
      SPRING_DATASOURCE_PASSWORD: ${PLANNER_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  activity-migration:
    <<: *activity-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=activity
      SPRING_DATASOURCE_USERNAME: activity_app
      SPRING_DATASOURCE_PASSWORD: ${ACTIVITY_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  notification-migration:
    <<: *notification-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  planner-service:
    <<: *planner-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=planner
      SPRING_DATASOURCE_USERNAME: planner_app
      SPRING_DATASOURCE_PASSWORD: ${PLANNER_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      planner-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  activity-service:
    <<: *activity-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=activity
      SPRING_DATASOURCE_USERNAME: activity_app
      SPRING_DATASOURCE_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      activity-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 640m

  notification-service:
    <<: *notification-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 384m

  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      planner-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 64m

volumes:
  postgres-data:
  kafka-data:
