name: todorok

x-planner-image: &planner-image
  image: todorok/planner-service:local
  build:
    context: ../..
    dockerfile: services/planner-service/Dockerfile

x-activity-image: &activity-image
  image: todorok/activity-service:local
  build:
    context: ../..
    dockerfile: services/activity-service/Dockerfile

x-notification-image: &notification-image
  image: todorok/notification-service:local
  build:
    context: ../..
    dockerfile: services/notification-service/Dockerfile

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=1
      - -c
      - max_replication_slots=1
      - -c
      - max_slot_wal_keep_size=2048MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  postgres-provision:
    image: postgres:17.11-alpine
    restart: "no"
    entrypoint: ["bash", "/provision/001-create-service-roles.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
      DATABASE_CREDENTIAL_UPDATE: ${DATABASE_CREDENTIAL_UPDATE:-false}
    volumes:
      - ./postgres/init:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    entrypoint: ["bash", "/kafka-init/initialize-topics.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes:
      - ./kafka:/kafka-init:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m

  planner-migration:
    <<: *planner-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=planner
      SPRING_DATASOURCE_USERNAME: planner_app
      SPRING_DATASOURCE_PASSWORD: ${PLANNER_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    mem_limit: 384m

  activity-migration:
    <<: *activity-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=activity
      SPRING_DATASOURCE_USERNAME: activity_app
      SPRING_DATASOURCE_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    mem_limit: 448m

  notification-migration:
    <<: *notification-image
    restart: "no"
    entrypoint: ["java", "-jar", "/app/migration.jar", "--spring.profiles.active=migration"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    mem_limit: 320m

  replication-init:
    image: postgres:17.11-alpine
    restart: "no"
    entrypoint: ["bash", "/replication/initialize-outbox-replication.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    volumes:
      - ./postgres/replication:/replication:ro
    depends_on:
      postgres:
        condition: service_healthy
      planner-migration:
        condition: service_completed_successfully
      activity-migration:
        condition: service_completed_successfully
    mem_limit: 128m

  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: todorok-connect
      CONFIG_STORAGE_TOPIC: todorok.connect.configs
      OFFSET_STORAGE_TOPIC: todorok.connect.offsets
      STATUS_STORAGE_TOPIC: todorok.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "127.0.0.1:8084:8083"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      replication-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m

  connect-init:
    image: todorok/connect-init:local
    build:
      context: ./connect
      dockerfile: Dockerfile
    restart: "no"
    environment:
      CONNECT_URL: http://connect:8083
      POSTGRES_DB: ${POSTGRES_DB}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
      CONNECTOR_CONFIG_UPDATE: ${CONNECTOR_CONFIG_UPDATE:-false}
    depends_on:
      connect:
        condition: service_healthy
    mem_limit: 64m

  planner-service:
    <<: *planner-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=planner
      SPRING_DATASOURCE_USERNAME: planner_app
      SPRING_DATASOURCE_PASSWORD: ${PLANNER_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-todorok}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-todorok-api}
      AUTH_PUBLIC_KEY_LOCATION: file:/run/secrets/auth_public_key
      AUTH_PRIVATE_KEY_LOCATION: file:/run/secrets/auth_private_key
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      planner-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/api/planner/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    secrets: [auth_public_key, auth_private_key]

  planner-bootstrap:
    <<: *planner-image
    profiles: [bootstrap]
    restart: "no"
    entrypoint: ["java", "-jar", "/app/bootstrap.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=planner
      SPRING_DATASOURCE_USERNAME: planner_app
      SPRING_DATASOURCE_PASSWORD: ${PLANNER_DB_PASSWORD}
      TODOROK_BOOTSTRAP_EMAIL: ${TODOROK_BOOTSTRAP_EMAIL:-}
      TODOROK_BOOTSTRAP_PASSWORD: ${TODOROK_BOOTSTRAP_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
    depends_on:
      planner-migration:
        condition: service_completed_successfully
    mem_limit: 384m

  activity-service:
    <<: *activity-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=activity
      SPRING_DATASOURCE_USERNAME: activity_app
      SPRING_DATASOURCE_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      AUTH_ISSUER: ${AUTH_ISSUER:-todorok}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-todorok-api}
      AUTH_PUBLIC_KEY_LOCATION: file:/run/secrets/auth_public_key
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      activity-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/api/activity/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 640m
    secrets: [auth_public_key]

  notification-service:
    <<: *notification-image
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      AUTH_ISSUER: ${AUTH_ISSUER:-todorok}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-todorok-api}
      AUTH_PUBLIC_KEY_LOCATION: file:/run/secrets/auth_public_key
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      notification-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 384m
    secrets: [auth_public_key]

  nginx:
    image: todorok/nginx:local
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      planner-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 64m

volumes:
  postgres-data:
  kafka-data:

secrets:
  auth_public_key:
    file: ${AUTH_PUBLIC_KEY_FILE:-../../.local/auth/public.pem}
  auth_private_key:
    file: ${AUTH_PRIVATE_KEY_FILE:-../../.local/auth/private.pem}
