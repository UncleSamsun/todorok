worker_processes auto;

events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=30r/m;

    upstream planner_backend {
        server planner-service:8081;
    }

    upstream activity_backend {
        server activity-service:8082;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/planner/v1/auth/(login|refresh)$ {
            limit_req zone=auth_requests burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @auth_limited;
            proxy_pass http://planner_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @auth_limited {
            default_type application/problem+json;
            add_header X-Trace-Id $request_id always;
            add_header Retry-After 60 always;
            return 429 '{"type":"about:blank","title":"Too many requests","status":429,"detail":"Try again later.","code":"RATE_LIMITED","traceId":"$request_id","retryable":true}';
        }

        location /api/planner/ {
            proxy_pass http://planner_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/activity/v1/internal(?:/|$) {
            return 404;
        }

        location ~ ^/api/activity/v1/(?:templates|activities)(?:/|$) {
            client_max_body_size 1m;
            error_page 413 = @template_payload_too_large;
            proxy_pass http://activity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @template_payload_too_large {
            default_type application/problem+json;
            add_header X-Trace-Id $request_id always;
            return 413 '{"type":"about:blank","title":"Payload too large","status":413,"detail":"Activity request bodies may be at most 1 MiB.","code":"PAYLOAD_TOO_LARGE","traceId":"$request_id","retryable":false}';
        }

        location /api/activity/ {
            proxy_pass http://activity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
