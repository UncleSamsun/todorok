openapi: 3.1.0
info:
  title: 토도록 Planner API
  version: 1.0.0
servers:
  - url: /api/planner/v1
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Calendar
  - name: Task
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: >-
        허용 목록에 있는 Origin 헤더가 필수다. 성공 시 todorok_refresh cookie를 발급한다.
        cookie는 HttpOnly, Secure, SameSite=Lax, Path=/api/planner/v1/auth이며 유효기간은 30일이다.
        local profile의 HTTP 개발에서만 Secure=false를 명시적으로 허용한다.
        계정당 1분에 5회, 서버가 관측한 원격 주소당 30회까지 로그인 요청을 허용한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      description: >-
        허용된 Origin 헤더와 todorok_refresh cookie가 필수다. 성공할 때마다 cookie를 회전한다.
        재사용하면 session family 전체를 폐기한다. 실패 시 같은 cookie 속성으로 삭제한다.
      security: []
      responses:
        '200': { $ref: '#/components/responses/SessionSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      description: >-
        bearer access token과 허용된 Origin이 필수다. 현재 사용자의 todorok_refresh cookie에 해당하는
        family를 폐기하고 발급과 동일한 cookie 속성으로 삭제한다. 다른 사용자 family는 변경하지 않는다.
      responses:
        '204':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: todorok_refresh=; Path=/api/planner/v1/auth; Max-Age=0; Secure; HttpOnly; SameSite=Lax
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /calendar:
    get:
      tags: [Calendar]
      operationId: getCalendarSummary
      description: 시작일과 종료일을 포함한 최대 42일의 달력 요약을 반환한다.
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: 달력 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSummaryResponse' }
        '400':
          description: 날짜 범위가 42일을 초과하거나 잘못된 요청
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /calendar/{date}:
    get:
      tags: [Calendar]
      operationId: getDayDetail
      parameters:
        - { $ref: '#/components/parameters/DatePath' }
      responses:
        '200':
          description: 선택 날짜 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks:
    post:
      tags: [Task]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /tasks/{taskId}:
    patch:
      tags: [Task]
      operationId: updateTask
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Task 수정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Task]
      operationId: deleteTask
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
        - { $ref: '#/components/parameters/VersionQuery' }
      responses:
        '204': { description: Task 삭제 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{taskId}/complete:
    post:
      tags: [Task]
      operationId: completeTask
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCommand' }
      responses:
        '200':
          description: Task 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{taskId}/reopen:
    post:
      tags: [Task]
      operationId: reopenTask
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCommand' }
      responses:
        '200':
          description: Task 재개
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    BearerAuth:
      $ref: './common-v1.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      description: from부터 최대 42일 범위의 종료일
      schema: { type: string, format: date }
    DatePath:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionQuery:
      name: version
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
  responses:
    SessionSuccess:
      description: 세션 발급 성공
      headers:
        Set-Cookie:
          description: 회전형 refresh cookie. HttpOnly; Secure; SameSite=Lax; Path=/api/planner/v1/auth; Max-Age=2592000
          schema: { type: string }
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionResponse' }
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: 인증 실패
      content:
        application/problem+json:
            schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: 허용되지 않은 Origin 또는 접근 거절
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: 인증 요청 제한 초과
      headers:
        Retry-After:
          description: 재시도 전에 기다릴 초
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: 버전 충돌
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: './common-v1.yaml#/components/schemas/ProblemDetails'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, userId]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        userId: { type: string, format: uuid }
    TaskType:
      type: string
      enum: [GENERAL, WORKOUT, STUDY, CLIMBING]
    TaskStatus:
      type: string
      enum: [PLANNED, COMPLETED, SKIPPED, DELETED]
    TaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, userId, title, taskType, scheduledDate, status, version]
      properties:
        taskId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        scheduledDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TaskStatus' }
        version: { type: integer, format: int64, minimum: 0 }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, taskType, scheduledDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        taskType: { $ref: '#/components/schemas/TaskType' }
        scheduledDate: { type: string, format: date }
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, scheduledDate, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        scheduledDate: { type: string, format: date }
        version: { type: integer, format: int64, minimum: 0 }
    VersionCommand:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    CalendarDaySummary:
      type: object
      additionalProperties: false
      required: [date, totalCount, completedCount, categoryProgress]
      properties:
        date: { type: string, format: date }
        totalCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        categoryProgress:
          type: array
          minItems: 4
          maxItems: 4
          description: GENERAL, WORKOUT, STUDY, CLIMBING을 각각 한 번씩 포함한다.
          items: { $ref: '#/components/schemas/CategoryProgress' }
    CategoryProgress:
      type: object
      additionalProperties: false
      required: [taskType, totalCount, completedCount]
      properties:
        taskType: { $ref: '#/components/schemas/TaskType' }
        totalCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
    CalendarSummaryResponse:
      type: object
      additionalProperties: false
      required: [from, to, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          maxItems: 42
          items: { $ref: '#/components/schemas/CalendarDaySummary' }
    DayDetailResponse:
      type: object
      additionalProperties: false
      required: [date, tasks]
      properties:
        date: { type: string, format: date }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskResponse' }
