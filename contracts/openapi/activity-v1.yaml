openapi: 3.1.0
info:
  title: 토도록 Activity API
  version: 1.0.0
servers:
  - url: /api/activity/v1
security:
  - BearerAuth: []
tags:
  - name: Activity
paths:
  /activities:
    post:
      tags: [Activity]
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
      responses:
        '201':
          description: Activity 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Activity]
      operationId: listActivities
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Activity 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /activities/{activityId}:
    get:
      tags: [Activity]
      operationId: getActivity
      parameters:
        - { $ref: '#/components/parameters/ActivityIdPath' }
      responses:
        '200':
          description: Activity 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activities/{activityId}/void:
    post:
      tags: [Activity]
      operationId: voidActivity
      parameters:
        - { $ref: '#/components/parameters/ActivityIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidActivityRequest' }
      responses:
        '200':
          description: Activity 무효화
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    BearerAuth:
      $ref: './common-v1.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    ActivityIdPath:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: 버전 또는 상태 충돌
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: './common-v1.yaml#/components/schemas/ProblemDetails'
    ActivityType:
      type: string
      enum: [WORKOUT, STUDY, CLIMBING]
    ActivityStatus:
      type: string
      enum: [COMPLETED, PARTIAL, VOIDED]
    ActivityCompletionStatus:
      type: string
      enum: [COMPLETED, PARTIAL]
    ActivityDetail:
      type: object
      additionalProperties: false
      description: Optional typed detail. Only the member matching activityType is accepted; an empty object is valid.
      properties:
        workout: { $ref: '#/components/schemas/WorkoutDetail' }
        study: { $ref: '#/components/schemas/StudyDetail' }
        climbing: { $ref: '#/components/schemas/ClimbingDetail' }
    WorkoutDetail:
      type: object
      additionalProperties: false
      properties:
        sets:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/WorkoutSet' }
    WorkoutSet:
      type: object
      additionalProperties: false
      properties:
        exercise: { type: string, maxLength: 120 }
        reps: { type: integer, minimum: 0, maximum: 100000 }
        weightKg: { type: number, minimum: 0, maximum: 10000 }
        durationSeconds: { type: integer, minimum: 0, maximum: 604800 }
    StudyDetail:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string, maxLength: 120 }
        durationMinutes: { type: integer, minimum: 0, maximum: 10080 }
        values: { type: object, additionalProperties: true }
        snapshot: { type: object, additionalProperties: true }
    ClimbingDetail:
      type: object
      additionalProperties: false
      properties:
        durationSeconds: { type: integer, minimum: 0, maximum: 604800 }
        rounds:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ClimbingRound' }
    ClimbingRound:
      type: object
      additionalProperties: false
      properties:
        grade: { type: string, maxLength: 40 }
        attempts: { type: integer, minimum: 0, maximum: 100000 }
        completed: { type: boolean }
    ActivitySyncState:
      type: string
      enum: [PENDING, APPLIED, CONFLICT, NOT_REQUIRED]
    CreateActivityRequest:
      type: object
      additionalProperties: false
      required: [commandId, taskId, activityType, completionStatus, performedAt, detail]
      properties:
        commandId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        completionStatus: { $ref: '#/components/schemas/ActivityCompletionStatus' }
        performedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: Optional actual interval start; requires endedAt and same Seoul date as performedAt. }
        endedAt: { type: string, format: date-time, description: Optional actual interval end; must follow startedAt on the same Seoul date. }
        note: { type: string, maxLength: 20000 }
        detail: { $ref: '#/components/schemas/ActivityDetail' }
    VoidActivityRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    ActivityResponse:
      type: object
      additionalProperties: false
      required: [activityId, commandId, taskId, userId, activityType, performedAt, detail, status, version]
      properties:
        activityId: { type: string, format: uuid }
        commandId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        performedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        detail: { $ref: '#/components/schemas/ActivityDetail' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        version: { type: integer, format: int64, minimum: 0 }
        note: { type: string }
        syncState: { $ref: '#/components/schemas/ActivitySyncState' }
        syncReason: { type: string }
    ActivityPageResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityResponse' }
        nextCursor:
          type: string
