openapi: 3.1.0
info:
  title: 토도록 Activity API
  version: 1.0.0
servers:
  - url: /api/activity/v1
security:
  - BearerAuth: []
tags:
  - name: Activity
  - name: Template
paths:
  /programs:
    get:
      tags: [Activity]
      operationId: listPrograms
      responses:
        '200':
          description: Imported immutable program catalog summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProgramCatalogSummary' }
  /program-enrollments:
    get:
      tags: [Activity]
      operationId: listProgramEnrollments
      responses:
        '200':
          description: Current owner's program enrollments, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProgramEnrollmentResponse' }
    post:
      tags: [Activity]
      operationId: enrollProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollProgramRequest' }
      responses:
        '201':
          description: Enrollment pinned to one catalog version with its first target session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnrollmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /program-enrollments/{enrollmentId}:
    get:
      tags: [Activity]
      operationId: getProgramEnrollment
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current enrollment progress and target session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnrollmentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{taskId}/record-template:
    get:
      tags: [Template]
      operationId: getTaskRecordTemplate
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current complete definition, or linked=false for a task without a binding. Read-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRecordTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /templates:
    post:
      tags: [Template]
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Created immutable template version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Template]
      operationId: listTemplates
      parameters:
        - name: domain
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TemplateDomain' }
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TemplateKind' }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Owner-scoped keyset page ordered by creation time and identity descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /templates/{templateId}:
    get:
      tags: [Template]
      operationId: getTemplate
      parameters:
        - { $ref: '#/components/parameters/TemplateIdPath' }
      responses:
        '200':
          description: Template identity with its complete current immutable version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /templates/{templateId}/versions/{templateVersion}:
    get:
      tags: [Template]
      operationId: getTemplateVersion
      parameters:
        - { $ref: '#/components/parameters/TemplateIdPath' }
        - name: templateVersion
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Complete immutable historical version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /templates/{templateId}/versions:
    post:
      tags: [Template]
      operationId: createTemplateVersion
      parameters:
        - { $ref: '#/components/parameters/TemplateIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateVersionRequest' }
      responses:
        '201':
          description: Template with its newly appended current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /templates/{templateId}/archive:
    post:
      tags: [Template]
      operationId: archiveTemplate
      parameters:
        - { $ref: '#/components/parameters/TemplateIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveTemplateRequest' }
      responses:
        '200':
          description: Archived template retaining every immutable version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /activities/summary:
    get:
      tags: [Activity]
      operationId: getMonthlyActivitySummary
      description: Read-only aggregate for one owner's performed activities in a Seoul calendar month.
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, description: Calendar month in YYYY-MM form. }
        - name: activityType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ActivityType' }
      responses:
        '200':
          description: Monthly activity aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyActivitySummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /activities:
    post:
      tags: [Activity]
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
      responses:
        '201':
          description: Activity 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Activity]
      operationId: listActivities
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Activity 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /activities/{activityId}:
    patch:
      tags: [Activity]
      operationId: correctActivity
      description: Replace editable values using the original templateSnapshot definition. Status, task, type, detailFormat and template identity/version/snapshot are immutable. Legacy Study JSON is preserved by the server. Omitted note or interval clears them. Invalidate all cached activity lists and planner days/months for this user after saving and after synchronization; the prior performed date is returned.
      parameters:
        - { $ref: '#/components/parameters/ActivityIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectActivityRequest' }
      responses:
        '200':
          description: Corrected record with incremented revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Activity]
      operationId: getActivity
      parameters:
        - { $ref: '#/components/parameters/ActivityIdPath' }
      responses:
        '200':
          description: Activity 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activities/{activityId}/void:
    post:
      tags: [Activity]
      operationId: voidActivity
      parameters:
        - { $ref: '#/components/parameters/ActivityIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidActivityRequest' }
      responses:
        '200':
          description: Activity 무효화
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    BearerAuth:
      $ref: './common-v1.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    TemplateIdPath:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActivityIdPath:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: 버전 또는 상태 충돌
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PayloadTooLarge:
      description: Template management body exceeds 1 MiB
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnsupportedMediaType:
      description: Compressed template management and activity record bodies are not supported
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    TemplateLink:
      $ref: './common-v1.yaml#/components/schemas/TemplateLink'
    TaskRecordTemplateResponse:
      type: object
      additionalProperties: false
      required: [linked]
      properties:
        linked: { type: boolean }
        templateLink: { $ref: '#/components/schemas/TemplateLink' }
        template: { $ref: '#/components/schemas/TemplateResponse' }
    ProblemDetails:
      $ref: './common-v1.yaml#/components/schemas/ProblemDetails'
    ProgramCatalogSummary:
      type: object
      additionalProperties: false
      required: [catalogKey, catalogVersion, checksum, name, sessionsPerWeek, totalWeeks]
      properties:
        catalogKey: { type: string }
        catalogVersion: { type: integer, format: int64, minimum: 1 }
        checksum: { type: string }
        name: { type: string }
        sessionsPerWeek: { type: integer, minimum: 1 }
        totalWeeks: { type: integer, minimum: 1 }
    EnrollProgramRequest:
      type: object
      additionalProperties: false
      required: [commandId, catalogKey, catalogVersion, initialTestValue]
      properties:
        commandId: { type: string, format: uuid }
        catalogKey: { type: string, minLength: 1, maxLength: 120 }
        catalogVersion: { type: integer, format: int64, minimum: 1 }
        initialTestValue: { type: integer, minimum: 0 }
        startWeek: { type: integer, minimum: 1 }
    ProgramSessionTarget:
      type: object
      additionalProperties: false
      required: [sessionId, week, session, targetSets]
      properties:
        sessionId: { type: string, format: uuid }
        week: { type: integer, minimum: 1 }
        session: { type: integer, minimum: 1 }
        targetSets:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
    ProgramEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollmentId, catalogKey, catalogVersion, recommendedWeek, startWeek, currentWeek, currentSession, status, target]
      properties:
        enrollmentId: { type: string, format: uuid }
        catalogKey: { type: string }
        catalogVersion: { type: integer, format: int64, minimum: 1 }
        recommendedWeek: { type: integer, minimum: 1 }
        startWeek: { type: integer, minimum: 1 }
        currentWeek: { type: integer, minimum: 1 }
        currentSession: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        target: { $ref: '#/components/schemas/ProgramSessionTarget' }
    TemplateDomain:
      type: string
      enum: [STUDY, WORKOUT, CLIMBING]
    TemplateKind:
      type: string
      enum: [STUDY_CATEGORY, FREE_WORKOUT, FREE_HANGBOARD, CLIMBING_SESSION]
    TemplateFieldType:
      type: string
      enum: [NUMBER, TIME, SHORT_TEXT, CHECK, MEMO]
    FieldDefinitionInput:
      type: object
      additionalProperties: false
      required: [fieldId, name, type]
      properties:
        fieldId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/TemplateFieldType' }
        unit: { type: string, maxLength: 40 }
    FieldDefinition:
      type: object
      additionalProperties: false
      required: [fieldId, name, type, position]
      properties:
        fieldId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/TemplateFieldType' }
        unit: { type: string, maxLength: 40 }
        position: { type: integer, minimum: 0 }
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [commandId, name, domain, kind, fields]
      properties:
        commandId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        domain: { $ref: '#/components/schemas/TemplateDomain' }
        kind: { $ref: '#/components/schemas/TemplateKind' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDefinitionInput' }
    CreateTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, name, fields]
      properties:
        commandId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 120 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDefinitionInput' }
    ArchiveTemplateRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision]
      properties:
        commandId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [templateId, templateVersion, name, fields]
      properties:
        templateId: { type: string, format: uuid }
        templateVersion: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDefinition' }
    TemplateResponse:
      type: object
      additionalProperties: false
      required: [templateId, domain, kind, archived, revision, currentVersion]
      properties:
        templateId: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/TemplateDomain' }
        kind: { $ref: '#/components/schemas/TemplateKind' }
        archived: { type: boolean }
        revision: { type: integer, format: int64, minimum: 0 }
        currentVersion: { $ref: '#/components/schemas/TemplateVersion' }
    TemplatePageResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TemplateResponse' }
        nextCursor: { type: string }
    ActivityType:
      type: string
      enum: [WORKOUT, STUDY, CLIMBING]
    ActivityStatus:
      type: string
      enum: [COMPLETED, PARTIAL, VOIDED]
    ActivityCompletionStatus:
      type: string
      enum: [COMPLETED, PARTIAL]
    MonthlyActivitySummaryResponse:
      type: object
      additionalProperties: false
      required: [month, activityType, completedCount, durationSeconds]
      properties:
        month: { type: string, description: Calendar month in YYYY-MM form. }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        completedCount: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
    ActivityDetail:
      type: object
      additionalProperties: false
      description: Optional typed detail. Only the member matching activityType is accepted; an empty object is valid.
      properties:
        workout: { $ref: '#/components/schemas/WorkoutDetail' }
        study: { $ref: '#/components/schemas/StudyDetail' }
        climbing: { $ref: '#/components/schemas/ClimbingDetail' }
    WorkoutDetail:
      type: object
      additionalProperties: false
      properties:
        sets:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/WorkoutSet' }
        fields:
          type: array
          description: Optional values for the server-selected free-workout template. Existing sets remain relational and separate.
          items: { $ref: '#/components/schemas/FieldInput' }
    WorkoutSet:
      type: object
      additionalProperties: false
      properties:
        exercise: { type: string, maxLength: 120 }
        reps: { type: integer, minimum: 0, maximum: 100000 }
        weightKg: { type: number, minimum: 0, maximum: 10000 }
        durationSeconds: { type: integer, minimum: 0, maximum: 604800 }
    StudyDetail:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string, maxLength: 120 }
        durationMinutes: { type: integer, minimum: 0, maximum: 10080 }
        fields:
          type: array
          description: Optional values for the server-selected template. Omitted fields are not stored; 0 and false are preserved.
          items: { $ref: '#/components/schemas/FieldInput' }
    FieldInput:
      type: object
      additionalProperties: false
      required: [fieldId, type]
      description: Exactly one non-null value member matching type is required. Blank text or memo is normalized to omitted.
      properties:
        fieldId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TemplateFieldType' }
        numberValue: { type: number }
        timeSeconds: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        textValue: { type: string, maxLength: 120 }
        checked: { type: boolean }
        memoValue: { type: string, maxLength: 20000 }
    ActivityDetailResponse:
      type: object
      additionalProperties: false
      properties:
        workout: { $ref: '#/components/schemas/WorkoutDetail' }
        study: { $ref: '#/components/schemas/StudyDetailResponse' }
        climbing: { $ref: '#/components/schemas/ClimbingDetail' }
    StudyDetailResponse:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string, maxLength: 120 }
        durationMinutes: { type: integer, minimum: 0, maximum: 10080 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldInput' }
    DetailFormat:
      type: string
      enum: [LEGACY, STANDARD, TEMPLATE]
    ActivityTemplateSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, templateId, templateVersion, name, domain, kind, fields]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        templateId: { type: string, format: uuid }
        templateVersion: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        domain: { $ref: '#/components/schemas/TemplateDomain' }
        kind: { $ref: '#/components/schemas/TemplateKind' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDefinition' }
    LegacyStudyPayload:
      type: object
      additionalProperties: false
      required: [provenance]
      description: Response-only original JSONB. Never interpret as validated template definitions or submit as input.
      properties:
        provenance: { type: string, enum: [UNVERIFIED_LEGACY] }
        values: {}
        snapshot: {}
    ClimbingDetail:
      type: object
      additionalProperties: false
      properties:
        durationSeconds: { type: integer, minimum: 0, maximum: 604800 }
        rounds:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ClimbingRound' }
        fields:
          type: array
          description: Optional values for the server-selected climbing template. Existing rounds remain relational and separate.
          items: { $ref: '#/components/schemas/FieldInput' }
    ClimbingRound:
      type: object
      additionalProperties: false
      properties:
        grade: { type: string, maxLength: 40 }
        attempts: { type: integer, minimum: 0, maximum: 100000 }
        completed: { type: boolean }
    ActivitySyncState:
      type: string
      enum: [PENDING, APPLIED, CONFLICT, NOT_REQUIRED]
    CreateActivityRequest:
      type: object
      additionalProperties: false
      required: [commandId, taskId, activityType, completionStatus, performedAt, detail]
      properties:
        commandId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        expectedTemplateVersion: { type: integer, format: int64, minimum: 1, description: Required for template-linked tasks; forbidden for unlinked tasks. Compared with current version under lock after successful command replay. }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        completionStatus: { $ref: '#/components/schemas/ActivityCompletionStatus' }
        performedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: Optional actual interval start; requires endedAt and same Seoul date as performedAt. }
        endedAt: { type: string, format: date-time, description: Optional actual interval end; must follow startedAt on the same Seoul date. }
        note: { type: string, maxLength: 20000 }
        detail: { $ref: '#/components/schemas/ActivityDetail' }
    CorrectActivityRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, performedAt, detail]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        performedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: Preserve the original wire timestamp when unchanged. Omitting both interval members clears the interval. }
        endedAt: { type: string, format: date-time, description: Preserve the original wire timestamp when unchanged. Omitting both interval members clears the interval. }
        note: { type: string, maxLength: 20000 }
        detail: { $ref: '#/components/schemas/ActivityDetail' }
    VoidActivityRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    ActivityResponse:
      type: object
      additionalProperties: false
      required: [activityId, commandId, taskId, userId, activityType, performedAt, detail, status, version]
      properties:
        activityId: { type: string, format: uuid }
        commandId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        performedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        detail: { $ref: '#/components/schemas/ActivityDetailResponse' }
        detailFormat: { $ref: '#/components/schemas/DetailFormat' }
        templateSnapshot: { $ref: '#/components/schemas/ActivityTemplateSnapshot' }
        legacyStudyPayload: { $ref: '#/components/schemas/LegacyStudyPayload' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        version: { type: integer, format: int64, minimum: 0 }
        note: { type: string }
        syncState: { $ref: '#/components/schemas/ActivitySyncState' }
        syncReason: { type: string }
