name: Feature
description: PRD 기반 기능 구현
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 사용자가 겪는 문제와 해결 이유를 작성합니다.
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: PRD 연결
      description: 관련 PRD 섹션과 수용 기준을 작성합니다.
      placeholder: "PRD §10, AC-3"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 이 이슈에서 구현할 내용을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: 비범위
      description: 이 이슈에서 다루지 않을 내용을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 검증 가능한 체크리스트로 작성합니다.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 테스트
      description: 단위·통합·계약·E2E 검증 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 의존성
      description: 선행 이슈, API, 이벤트 또는 마이그레이션을 작성합니다.

