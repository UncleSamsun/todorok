name: Bug
description: 재현 가능한 결함 수정
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 실제 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: 관련 PRD·수용 기준
      placeholder: "PRD §10, AC-3"
  - type: textarea
    id: evidence
    attributes:
      label: 증거
      description: 로그, 화면, 요청·응답과 환경 정보를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: 회귀 테스트
      description: 수정 후 추가할 자동 테스트를 작성합니다.
    validations:
      required: true

