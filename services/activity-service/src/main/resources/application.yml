spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  application:
    name: activity-service
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todorok?currentSchema=activity}
    username: ${SPRING_DATASOURCE_USERNAME:activity_app}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-with-activity-password}
  flyway:
    enabled: false
    default-schema: activity
    schemas: activity
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: activity

server:
  port: 8082
  servlet:
    context-path: /api/activity/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

todorok:
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  auth:
    issuer: ${AUTH_ISSUER:todorok}
    audience: ${AUTH_AUDIENCE:todorok-api}
    public-key: ${AUTH_PUBLIC_KEY:}
    public-key-location: ${AUTH_PUBLIC_KEY_LOCATION:}
