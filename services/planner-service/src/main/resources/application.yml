spring:
  application:
    name: planner-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todorok?currentSchema=planner}
    username: ${SPRING_DATASOURCE_USERNAME:planner_app}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-with-planner-password}
  flyway:
    enabled: false
    default-schema: planner
    schemas: planner
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: planner

server:
  port: 8081
  servlet:
    context-path: /api/planner/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

todorok:
  auth:
    issuer: ${AUTH_ISSUER:todorok}
    audience: ${AUTH_AUDIENCE:todorok-api}
    public-key: ${AUTH_PUBLIC_KEY:}
    public-key-location: ${AUTH_PUBLIC_KEY_LOCATION:}
    private-key: ${AUTH_PRIVATE_KEY:}
    private-key-location: ${AUTH_PRIVATE_KEY_LOCATION:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
